services:
  postgres:
    image: postgres:16-alpine
    container_name: tarefas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gerenciador_tarefas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d gerenciador_tarefas"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongodb:
    image: mongo:7.0
    container_name: tarefas-mongodb
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongodb_data:/data/db]
    healthcheck:
      test: ["CMD-SHELL","mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    container_name: tarefas-backend
    restart: unless-stopped
    env_file: ./backend/.env
    ports: ["3000:3000"]
    depends_on:
      postgres: {condition: service_healthy}
      mongodb: {condition: service_healthy}
  frontend:
    build: ./frontend
    container_name: tarefas-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
  mongodb_data:
