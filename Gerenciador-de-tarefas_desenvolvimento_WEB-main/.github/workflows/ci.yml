name: CI
on: [push, pull_request]
jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: backend/Dockerfile }
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: frontend/Dockerfile }
      - name: Auditoria de dependências
        run: |
          (cd backend && npm ci && npm audit --omit=dev --audit-level=high && npm run check)
          (cd frontend && npm ci && npm audit --omit=dev --audit-level=high)
      - name: Build das imagens
        run: |
          docker build -t tarefas-backend ./backend
          docker build -t tarefas-frontend --build-arg VITE_API_URL=/api ./frontend
      - uses: aquasecurity/trivy-action@0.24.0
        with: { image-ref: tarefas-backend, severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
      - uses: aquasecurity/trivy-action@0.24.0
        with: { image-ref: tarefas-frontend, severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }