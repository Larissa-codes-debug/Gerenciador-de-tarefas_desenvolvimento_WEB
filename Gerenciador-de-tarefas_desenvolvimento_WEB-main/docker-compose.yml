services:

  postgres:
    image: postgres:16-alpine
    container_name: tarefas-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: gerenciador_tarefas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gerenciador_tarefas"]
      interval: 5s
      timeout: 5s
      retries: 5


  mongodb:
    image: mongo:7.0
    container_name: tarefas-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db


  backend:
    build:
      context: ./backend

    container_name: tarefas-backend
    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started


  frontend:
    build:
      context: ./frontend

    container_name: tarefas-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:
  postgres_data:
  mongodb_data:

  